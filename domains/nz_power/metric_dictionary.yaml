# NZ electricity price metrics. Query only the views listed under `views`; never query fact_* or dim_* tables.
version: "2026-11"
owner: "nz-power-pipeline"

conventions:
  trading_day: "A trading day is a New Zealand calendar date (Pacific/Auckland)."
  trading_period: "Each trading day is split into 30-minute trading periods, numbered from local midnight. A normal day has 48; the day daylight saving ends (first Sunday of April) has 50; the day it starts (last Sunday of September) has 46."
  local_time: "period_start_local is New Zealand wall-clock time without a time zone. On the day daylight saving ends, 02:00-03:00 local time occurs twice, so local time does not identify a period uniquely; use trading_date + trading_period."
  price_unit: "NZD per MWh, 2 decimal places. Negative prices are real data; do not filter them out."
  price_version: "A period and node can have an interim price first and a final price later. Use mart_current_price, which already picks final when available and interim otherwise."
  node_id: "Node ids are upper-case strings such as ABY0111, not numbers."
  fuel: "Fuel is one of Hydro, Wind, Geothermal, Solar, Gas, Coal, Diesel, Wood, Battery storage. Source codes use two spellings (for example Hydro and HYD); they are already unified."
  generation: "Generation figures are EMI estimates (metered grid injections mapped to plants), in kWh per trading period; divide by 1000 for MWh. They come from mart_daily_generation and mart_daily_generation_weighted_price."
  not_available: "There is no demand or consumption volume data, so demand-weighted (load-weighted) prices cannot be computed. weighted_avg_price is a different, supply-side measure: it is weighted by generation. Island, zone and region come from EMI's Network Supply Points table (snapshot 2026-11-06): group by island (NI/SI) or zone (UNI/LNI/CNI/USI/LSI) through v_dim_node; region (distribution network area) is NULL for the 18 transmission-grid nodes, and zone is NULL for node KAW2201 (missing in the source)."

views:
  - view: mart_current_price
    grain: "one row per trading period per node"
    description: "Best available price for each period and node: final if it exists, otherwise interim."
    keys: [trading_date, trading_period, node_id]
  - view: mart_daily_price
    grain: "one row per trading day per node"
    description: "Daily summary built on mart_current_price: average, minimum and maximum price, number of periods, number of interim periods."
    keys: [trading_date, node_id]
  - view: v_dim_node
    grain: "one row per node"
    description: "Node dimension (name, island, zone, region) plus the first trading day the node appears in the data."
    keys: [node_id]
  - view: mart_daily_generation
    grain: "one row per trading day per island, zone and fuel"
    description: "Estimated generation (kWh) and number of plants by trading day, island, zone and fuel. Includes plants at nodes with no price; their island and zone are NULL."
    keys: [trading_date, island, zone, fuel]
  - view: mart_daily_generation_weighted_price
    grain: "one row per trading day per island and fuel"
    description: "Generation-weighted average price by trading day, island and fuel: the average price at which that fuel's generation was sold. Covers only generation at nodes with a price."
    keys: [trading_date, island, fuel]

metrics:
  - name: Period price
    en: price_nzd_per_mwh
    aliases: ["price", "spot price", "half-hourly price"]
    unit: NZD/MWh
    view: mart_current_price
    column: price_nzd_per_mwh
    definition: Price of one node in one 30-minute trading period, using the best available version (final if it exists, otherwise interim).
    pitfalls:
      - "Prices can be negative; do not filter them."
      - "An interim price may be revised later; say so when answering about recent data."
      - "Do not query fact_electricity_price directly: a period can have both a final and an interim row, which double-counts."

  - name: Price version
    en: price_version
    aliases: ["final or interim"]
    unit: ""
    view: mart_current_price
    column: price_version
    definition: Version of the selected price, either final or interim. It is interim only when no final price exists.
    pitfalls:
      - "Interim means the price may still be revised, not that the data is wrong."

  - name: Daily average price
    en: avg_price
    aliases: ["average price", "daily average", "daily price"]
    unit: NZD/MWh
    view: mart_daily_price
    column: avg_price
    definition: Simple average of a node's period prices within one trading day, rounded to 2 decimals. Every period is 30 minutes, so the simple average equals the time-weighted average.
    pitfalls:
      - "Not volume-weighted: there is no volume data, so a volume-weighted average price cannot be answered."
      - "Averaging across nodes has no clear business meaning; do not present it as a national price."
      - "When averaging several days, days with 46 or 50 periods (daylight saving changes) make an average of daily averages differ slightly from the true per-period average; for exact multi-day averages, average mart_current_price directly."
      - "If interim_period_count is greater than 0 for that day, the daily average is not final yet."

  - name: Daily minimum price
    en: min_price
    aliases: ["lowest price", "daily low"]
    unit: NZD/MWh
    view: mart_daily_price
    column: min_price
    definition: Lowest period price of a node within one trading day.
    pitfalls:
      - "Can be negative."

  - name: Daily maximum price
    en: max_price
    aliases: ["highest price", "peak price", "daily high", "price spike"]
    unit: NZD/MWh
    view: mart_daily_price
    column: max_price
    definition: Highest period price of a node within one trading day.
    pitfalls:
      - "It describes a single 30-minute period, not the price level of the whole day; for a question about a price surge, also look at the daily average."

  - name: Number of priced periods
    en: period_count
    aliases: ["number of trading periods"]
    unit: periods
    view: mart_daily_price
    column: period_count
    definition: Number of trading periods with a price for a node on a trading day. 48 on a normal day, 50 when daylight saving ends, 46 when it starts.
    pitfalls:
      - "A count below the expected number for that day means data is missing; say so before answering."
      - "Do not assume every day has 48 periods."

  - name: Number of interim periods
    en: interim_period_count
    aliases: ["interim periods"]
    unit: periods
    view: mart_daily_price
    column: interim_period_count
    definition: Number of periods on a trading day that still use an interim price for a node. 0 means the daily average is based entirely on final prices.
    pitfalls:
      - "Use this to decide whether a daily average is final; do not infer it from the date."

  - name: First seen date
    en: first_seen_date
    aliases: ["first appeared", "new node"]
    unit: date
    view: v_dim_node
    column: first_seen_date
    definition: Earliest trading day on which the node appears in the data.
    pitfalls:
      - "NULL means the node already existed at the start of the data (a baseline node) and its real start date is unknown; it does not mean the node has no data."
      - "It is the first date in this data set, not necessarily when the node actually began operating."

  - name: Daily generation
    en: generation_kwh
    aliases: ["generation", "output", "electricity generated", "supply by fuel"]
    unit: kWh
    view: mart_daily_generation
    column: generation_kwh
    definition: Estimated electricity generated on one trading day, grouped by island, zone and fuel, in kWh.
    pitfalls:
      - "An EMI estimate (metered grid injections mapped to plants), not figures reported by the plants."
      - "kWh, not MWh: divide by 1000 for MWh and by 1,000,000 for GWh."
      - "Includes plants at nodes that have no price (for example WPG0331); their island and zone are NULL, so adding up only the rows with an island leaves them out."
      - "Battery storage appears as a fuel; do not read its figure as renewable generation."

  - name: Number of generating plants
    en: plant_count
    aliases: ["number of plants", "plants generating"]
    unit: plants
    view: mart_daily_generation
    column: plant_count
    definition: Number of distinct plants (by plant code) with generation records for that day, island, zone and fuel.
    pitfalls:
      - "A plant connected at several nodes or networks is counted once per row group, so plant counts of different rows can overlap if a plant appears in more than one island or zone."

  - name: Generation-weighted average price
    en: weighted_avg_price
    aliases: ["generation-weighted price", "price received by fuel", "average price by fuel", "capture price"]
    unit: NZD/MWh
    view: mart_daily_generation_weighted_price
    column: weighted_avg_price
    definition: Average price at which a fuel's generation was sold on one trading day in one island, weighted by the estimated generation in each trading period at each node, rounded to 2 decimals.
    pitfalls:
      - "This is a supply-side price, not a demand-weighted price and not the average price consumers pay: there is still no demand or consumption volume data."
      - "Covers only generation at nodes that have a price (about 99.6 percent of all generation for 2026-04 to 2026-09); compare priced_generation_kwh here with generation_kwh in mart_daily_generation."
      - "NULL when the fuel's generation weight for that day is 0."
      - "If interim_generation_kwh is greater than 0, part of the price is still interim and may be revised."
      - "Do not average several days of weighted_avg_price with a plain average; weight each day by priced_generation_kwh."
      - "Prices can be negative; do not filter them."

  - name: Generation with a price
    en: priced_generation_kwh
    aliases: ["priced generation", "weights"]
    unit: kWh
    view: mart_daily_generation_weighted_price
    column: generation_kwh
    definition: Estimated generation (kWh) that has a price, that is the weights behind weighted_avg_price for the same day, island and fuel.
    pitfalls:
      - "Smaller than generation_kwh in mart_daily_generation because generation at nodes with no price is left out."

  - name: Generation priced with interim prices
    en: interim_generation_kwh
    aliases: ["interim-priced generation"]
    unit: kWh
    view: mart_daily_generation_weighted_price
    column: interim_generation_kwh
    definition: Part of priced_generation_kwh whose price is still interim. 0 means weighted_avg_price is based entirely on final prices.
    pitfalls:
      - "Use this to decide whether a weighted price is final; do not infer it from the date."
