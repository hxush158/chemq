# NZ 电力的评测题。字段和生成方式同 domains/chem/eval/cases.yaml：
# 标准答案不手填，make golden 用服务库执行参考 SQL，生成 golden.jsonl（第 2 项让 build_golden 走引擎之后才能跑）。
#
# 出题约束（docs/11 第八节）：
#   - 节点级题避开 WHU1101、OHG1101（数据开始后才出现、首日只有部分时段），除非题目就是考新节点
#   - 查出 0 行的题用 assert_type: no_data（W3 第 0 步 ② 起）。参考 SQL 照写，make golden 生成空的 expected，顺便核对确实是 0 行
#   - 现有数据全是 final，出不了 interim 相关的题
#   - 不要和 router_examples.yaml 用同一个节点 + 日期
#   - 不要出指标字典里写着答案的例子：北岛 2026-04-08 的平均价（162.08，162 个节点）、
#     南岛 2026-07-15 各节点日均价的范围（7.78 ~ 61.88）—— 字典进提示词，等于把答案给了模型
# method：每题一句话的算法说明，口径送审用（make review-golden）。只写算法，不写 SQL；不写的话送审脚本会报错。

- set: golden
  id: N001
  method: OTA2201 在 2026-09-20 的 mart_daily_price.avg_price（该节点当天各时段价格的简单平均，保留 2 位）
  week: 1
  difficulty: easy
  intent: metric_query
  metrics: [Daily average price]
  question: What was the daily average price at OTA2201 on 20 September 2026?
  sql: SELECT avg_price AS v FROM mart_daily_price WHERE node_id = 'OTA2201' AND trading_date = DATE '2026-09-20'
- set: golden
  id: N002
  method: HAY2201 在 2026-04-05 的 mart_daily_price.period_count（当天有价格的时段数）
  week: 1
  difficulty: medium
  intent: metric_query
  metrics: [Number of priced periods]
  question: How many trading periods did HAY2201 have on 5 April 2026?
  sql: SELECT period_count AS v FROM mart_daily_price WHERE node_id = 'HAY2201' AND trading_date = DATE '2026-04-05'
  note: 夏令时结束那天，答案是 50，不是 48
- set: golden
  id: N003
  method: BEN2201 在 2026-09-26 的 mart_current_price 里价格最高的那一行，返回时段号和价格
  week: 1
  difficulty: medium
  intent: metric_query
  metrics: [Period price]
  question: On 26 September 2026, what was the highest half-hourly price at BEN2201, and in which trading period?
  sql: SELECT trading_period AS k, price_nzd_per_mwh AS v FROM mart_current_price WHERE node_id = 'BEN2201' AND trading_date = DATE '2026-09-26' ORDER BY v DESC LIMIT 1
  note: 这天上游同时有 interim 和 final 两份文件，mart_current_price 取 final；直接查 fact 表会重复
- set: golden
  id: N004
  method: v_dim_node 里 first_seen_date 在 2026-04-01 ~ 2026-09-30 之间的节点，返回节点和首次出现日期
  week: 1
  difficulty: medium
  intent: metric_query
  metrics: [First seen date]
  question: Which nodes first appeared in the data between April and September 2026?
  sql: SELECT node_id AS k, first_seen_date AS v FROM v_dim_node WHERE first_seen_date BETWEEN DATE '2026-04-01' AND DATE '2026-09-30' ORDER BY 1
  note: 答案是 OHG1101、WHU1101。first_seen_date 为 NULL 的是数据开始时就有的节点，不算
- set: golden
  id: N005
  method: 对 SI（v_dim_node.island）在 2026-08-15 的 mart_current_price 行直接平均（每个节点时段价格计一次），保留 2 位，并数节点数
  week: 1
  difficulty: medium
  intent: metric_query
  metrics: [Period price]
  question: What was the average spot price across South Island nodes on 15 August 2026?
  sql: SELECT count(DISTINCT p.node_id) AS k, round(avg(p.price_nzd_per_mwh), 2) AS v FROM mart_current_price p JOIN v_dim_node n ON n.node_id = p.node_id WHERE n.island = 'SI' AND p.trading_date = DATE '2026-08-15'
  notes_must_contain: [unweighted]
  note: >-
    字典 2026-11.1 起按岛平均价可以回答（cross_node_average）：节点价格的不加权简单平均，要给节点数（k）并写明 unweighted。
    算法只有一种（2026-11.2）：范围内 mart_current_price 的行直接求平均，每个节点时段价格计一次；参考 SQL 就是这么写的。
    这一天所有节点时段完整，区分不了"直接平均"和"先按节点平均再平均"；要验证算法得另出有节点时段不全的题（第 1 步）。
    notes_must_contain 检查 Answer.notes（第 0 步第 ⑤ 项，11/13 起生效）。原来这题是"按岛屿汇总 → 拒答"。

