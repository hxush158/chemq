# NZ Power 领域包的引擎侧配置。设计见 docs/11-domain-pack-design.md 第四节。
id: nz_power
locale: en
knowledge_base: false
display_name: NZ Electricity Market
schema: main
schema_by_dialect:
  snowflake: MART
dialects: [duckdb, snowflake]

catalog:
  views: [mart_current_price, mart_daily_price, v_dim_node, mart_daily_generation, mart_daily_generation_weighted_price]
  dims: []
  # 数据覆盖区间按哪一列算（coverage.yaml、Router 的 data_range）
  date_column: {relation: mart_daily_price, column: trading_date}
  # 维度取值：节点列出 id、名称、岛、分区，用户说名称（Haywards、Otahuhu）模型也能对上 id。
  # NULL 自动跳过（KAW2201 没有 zone；region 不列，18 个输电节点为 NULL）。燃料只有 9 种，全部列出。
  values:
    - title: Node (node_id · node_name · island · zone · first_seen_date)
      sql: SELECT node_id, node_name, island, zone, first_seen_date FROM v_dim_node ORDER BY 1
    - title: Fuel (fuel)
      sql: SELECT DISTINCT fuel FROM mart_daily_generation ORDER BY 1

eval:
  as_of: "2026-09-30"
  # 判分误差（run_eval）：typed = 按标准答案的写法区分 —— 没有小数点的必须完全相等；
  # 1–2 位小数的绝对误差不超过 0.01；更多位的相对误差 0.5%。不写 = 一律相对误差 0.5%（chem 用的就是这个）。
  # nz-power 11/10 的建议：0.5% 对发电量（kWh）和价格都太宽，口径陷阱题会测不出来。
  tolerance: typed
  snapshot:
    rows: 2156450               # mart_current_price 的行数
    price_sum: "137078471.80"   # sum(CAST(price_nzd_per_mwh AS DECIMAL(18, 2)))
    # 发电（nz-power 11/9 给的核对值，DuckDB 和 Snowflake 相同）
    generation_kwh_sum: "21818516933"          # mart_daily_generation 的 sum(generation_kwh)
    weighted_generation_kwh_sum: "21739225499" # mart_daily_generation_weighted_price 的 sum(generation_kwh)
    weighted_rows: 2130                        # mart_daily_generation_weighted_price 的行数

serving:
  date_columns:                # 每个对象按哪一列截到 as_of；没列出来的不截
    mart_current_price: trading_date
    mart_daily_price: trading_date
    v_dim_node: first_seen_date
    mart_daily_generation: trading_date
    mart_daily_generation_weighted_price: trading_date

# 不写 scope：NZ 数据没有按范围隔离，DuckDBEngine 收到任何 scope 都会拒绝。

# 填进通用提示词模板（ai/src/chemq/prompts/en/）的空位 {{name}}。键和 domains/chem/domain.yaml 一一对应。
prompt_slots:
  system_name: NZ electricity market analysis system
  assistant_name: NZ electricity market analysis assistant
  data_name: NZ wholesale electricity price and generation data
  analysis_scope: NZ wholesale electricity prices and generation
  agent_question_scope: questions about NZ wholesale electricity prices and generation
  # NZ 没有知识库；W3 起定义类问题用指标字典回答（kb_answer 模板里的"资料"就是字典条目）
  kb_scope: the metric dictionary (metric definitions and market conventions)
  knowledge_topics: metric definitions and market conventions
  knowledge_example: what does an interim price mean
  out_of_scope_examples: demand or consumption, demand-weighted (load-weighted) prices, forecasts
  lookalike_note: |2-
      ⚠ Judge only by whether the metric is in the dictionary, not by the wording: "price spike" and "peak price"
        are aliases of the daily maximum price and are supported; generation by fuel, island or zone is supported.
        "Generation-weighted average price" is a supply-side price by island and fuel; it is NOT a demand-weighted
        or "volume-weighted" price for a node or for consumers, which is out of scope.
        An average price by island or zone is supported (an unweighted simple average across nodes; see the
        cross_node_average convention). A question about the "national price" is NOT out of scope: answer it with
        the two benchmark nodes OTA2201 and BEN2201 (see the reference_nodes convention).
  no_hardcode_examples: the number of trading periods in a day or a list of node ids
  filter_dimensions: node_id, node_name, island, zone, fuel
  dimension_examples: node_id, island, zone, fuel
  breakdown_example: a breakdown by node or by trading period
  kb_ref_example: KB-NZ-001#1
