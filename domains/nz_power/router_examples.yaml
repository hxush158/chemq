# Router 的 few-shot 示例（NZ 电力）。格式同 domains/chem/router_examples.yaml。
# ⚠ 不要写评测题原话，也别用评测题的节点 + 日期组合（eval/cases.yaml 用了 OTA2201 / HAY2201 / BEN2201）。
# ⚠ 出评测题时反过来也要避开这里的组合：ISL2201、WKM2201；SI 8 月按燃料；NI 风电 7 月加权价；地热 5/1；
#   NI 7 月按岛平均价；9/29 的全国价（OTA2201 + BEN2201）；ROX2201 8/14；负电价的含义。
# 指标名用 metric_dictionary.yaml 里的 name。基准时间的写法要和 pipeline 给 Router 的前缀一致（第 5 项改成按语言取）。
- note: '(one node, one trading day)'
  question: |-
    Base date: 2026-09-30
    User question: What was the daily average price at ISL2201 on 15 September?
  plan: '{"intent": "metric_query", "metrics": ["Daily average price"], "filters": {"node_id": "ISL2201"}, "time_range": {"start": "2026-09-15", "end": "2026-09-15", "grain": "day"}, "needs_knowledge": false, "reasoning": "One node on one trading day. \"15 September\" takes the base year: 2026-09-15."}'
- note: '(no time given: use the base month)'
  question: |-
    Base date: 2026-09-30
    User question: Show me the average price at WKM2201.
  plan: '{"intent": "metric_query", "metrics": ["Daily average price"], "filters": {"node_id": "WKM2201"}, "time_range": {"start": "2026-09-01", "end": "2026-09-30", "grain": "month"}, "needs_knowledge": false, "reasoning": "No time given, so use the base month 2026-09 and still fill it into time_range."}'
- note: '(last N days: count the days, the base date is included)'
  question: |-
    Base date: 2026-09-30
    User question: What was the highest price at ISL2201 over the last 7 days?
  plan: '{"intent": "metric_query", "metrics": ["Daily maximum price"], "filters": {"node_id": "ISL2201"}, "time_range": {"start": "2026-09-24", "end": "2026-09-30", "grain": "day"}, "needs_knowledge": false, "reasoning": "Last 7 days including the base date: 24, 25, 26, 27, 28, 29, 30 — 7 days, matching the 7 in the question. Start is the base date minus 6 days, not minus 7."}'
- note: '(two-period comparison: the other period goes into compare_range; whether it has data is decided by the system)'
  question: |-
    Base date: 2026-09-30
    User question: Was the average price at WKM2201 higher in August than in July?
  plan: '{"intent": "metric_query", "metrics": ["Daily average price"], "filters": {"node_id": "WKM2201"}, "time_range": {"start": "2026-08-01", "end": "2026-08-31", "grain": "month"}, "compare_range": {"start": "2026-07-01", "end": "2026-07-31", "grain": "month"}, "needs_knowledge": false, "reasoning": "The period asked about is August 2026; \"than in July\" is the comparison period, 2026-07, so it goes into compare_range."}'
- note: '(daylight saving day: only extract the day; the number of periods comes from the data)'
  question: |-
    Base date: 2026-09-30
    User question: How many trading periods did ISL2201 have on 27 September?
  plan: '{"intent": "metric_query", "metrics": ["Number of priced periods"], "filters": {"node_id": "ISL2201"}, "time_range": {"start": "2026-09-27", "end": "2026-09-27", "grain": "day"}, "needs_knowledge": false, "reasoning": "One node on one trading day, 2026-09-27. Do not assume 48: the count is read from the data."}'
- note: '(refuse: the metric needs volume data, which does not exist)'
  question: |-
    Base date: 2026-09-30
    User question: What was the volume-weighted average price at WKM2201 last month?
  plan: '{"intent": "out_of_scope", "metrics": ["volume-weighted average price"], "needs_knowledge": false, "reasoning": "There is no demand or consumption volume, so a demand-weighted price for a node cannot be computed. The generation-weighted average price is a different, supply-side measure by island and fuel, and the daily average price is a simple average; neither may be used instead."}'
- note: '(refuse: not price data at all)'
  question: |-
    Base date: 2026-09-30
    User question: How much electricity did New Zealand use yesterday?
  plan: '{"intent": "out_of_scope", "metrics": ["demand"], "needs_knowledge": false, "reasoning": "Demand and consumption are not in the metric dictionary; only prices and generation are available."}'
- note: '(generation by fuel for one island over a month)'
  question: |-
    Base date: 2026-09-30
    User question: Which fuel generated the most electricity in the South Island in August?
  plan: '{"intent": "metric_query", "metrics": ["Daily generation"], "dimensions": ["fuel"], "filters": {"island": "SI"}, "time_range": {"start": "2026-08-01", "end": "2026-08-31", "grain": "month"}, "needs_knowledge": false, "reasoning": "Generation by fuel for one island over August 2026: add up the daily generation for the month per fuel, then take the largest."}'
- note: '(generation-weighted price over several days: weight by priced generation, never average the daily values)'
  question: |-
    Base date: 2026-09-30
    User question: At what average price was North Island wind generation sold in July?
  plan: '{"intent": "metric_query", "metrics": ["Generation-weighted average price", "Generation with a price"], "filters": {"island": "NI", "fuel": "Wind"}, "time_range": {"start": "2026-07-01", "end": "2026-07-31", "grain": "month"}, "needs_knowledge": false, "reasoning": "Supply-side price for one fuel and island over July 2026. Across several days it must be weighted by Generation with a price, not a simple average of the daily weighted prices."}'
- note: '(units: generation is stored in kWh)'
  question: |-
    Base date: 2026-09-30
    User question: How many MWh did geothermal plants generate on 1 May?
  plan: '{"intent": "metric_query", "metrics": ["Daily generation"], "filters": {"fuel": "Geothermal"}, "time_range": {"start": "2026-05-01", "end": "2026-05-01", "grain": "day"}, "needs_knowledge": false, "reasoning": "One fuel on one trading day, all islands. Generation is stored in kWh; the question asks for MWh, so divide by 1000."}'
- note: '(average price across the nodes of an island: supported, an unweighted simple average)'
  question: |-
    Base date: 2026-09-30
    User question: What was the average spot price across North Island nodes in July?
  plan: '{"intent": "metric_query", "metrics": ["Period price"], "filters": {"island": "NI"}, "time_range": {"start": "2026-07-01", "end": "2026-07-31", "grain": "month"}, "needs_knowledge": false, "reasoning": "An average across the nodes of one island is supported (cross_node_average): an unweighted simple average of node prices over July 2026, computed directly from period prices (every node-period price counts once) and reported with the number of nodes and the date range. It is not a market price."}'
- note: '(national price: do not refuse and do not average all nodes; use the two benchmark nodes)'
  question: |-
    Base date: 2026-09-30
    User question: What was the national electricity price yesterday?
  plan: '{"intent": "metric_query", "metrics": ["Daily average price"], "dimensions": ["node_id"], "filters": {"node_id": "OTA2201, BEN2201"}, "time_range": {"start": "2026-09-29", "end": "2026-09-29", "grain": "day"}, "needs_knowledge": false, "reasoning": "New Zealand has nodal pricing, so there is no single national price (reference_nodes). Answer with the daily average price at the benchmark nodes OTA2201 (North Island) and BEN2201 (South Island) for 2026-09-29, one row per node."}'
- note: '(a number plus what it means: mixed; the explanation comes from the metric dictionary)'
  question: |-
    Base date: 2026-09-30
    User question: How many interim periods did ROX2201 have on 14 August, and what does an interim price mean?
  plan: '{"intent": "mixed", "metrics": ["Number of interim periods"], "filters": {"node_id": "ROX2201"}, "time_range": {"start": "2026-08-14", "end": "2026-08-14", "grain": "day"}, "needs_knowledge": true, "reasoning": "The number comes from the data (one node, one trading day, 2026-08-14); what an interim price means is a market convention answered from the metric dictionary. Both are needed, so it is mixed."}'
- note: '(definition or market convention only, no number from the data: knowledge_lookup)'
  question: |-
    Base date: 2026-09-30
    User question: Why can electricity prices be negative?
  plan: '{"intent": "knowledge_lookup", "metrics": [], "needs_knowledge": true, "reasoning": "Asks about a market convention, not a number from the data; answered from the metric dictionary."}'
