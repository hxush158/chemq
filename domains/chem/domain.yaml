# 化工领域包的引擎侧配置。设计见 docs/11-domain-pack-design.md 第四节。
id: chem
locale: zh
display_name: 示例化工

# 语义层所在的 schema。sqlguard 的白名单、没写 schema 的表、search_path 都用它。
schema: chem

# 语义层目录（scripts/build_catalog.py 生成 semantic_catalog.md）。
# 白名单 = schema + views + dims：模型能查的就是目录里列出的这些，两边不会对不上。
catalog:
  views: [v_plant_daily, v_energy_daily, v_sales_daily, v_monthly_summary]
  dims: [dim_date, dim_plant, dim_product, dim_customer, dim_energy_type]
  # 数据覆盖区间从这一列的 min / max 算，写进 coverage.yaml
  date_column: {relation: v_plant_daily, column: date_key}
  # 维度取值：按名称过滤时模型只能用这里的原值
  values:
    - title: 装置（plant_id / plant_name）
      sql: SELECT plant_id, plant_name, plant_type FROM dim_plant ORDER BY 1
    - title: 产品（product_id / product_name）
      sql: SELECT product_id, product_name, product_grade FROM dim_product ORDER BY 1
    - title: 大区（region）
      sql: SELECT DISTINCT region FROM v_sales_daily ORDER BY 1
    - title: 客户（customer_id / customer_name）
      sql: SELECT customer_id, customer_name, region FROM dim_customer ORDER BY 1
    - title: 能源（energy_id / energy_name）
      sql: SELECT energy_id, energy_name, uom FROM dim_energy_type ORDER BY 1

# 数据权限（scope）：化工按大区隔离。Postgres 侧 RLS 策略读会话变量 chemq.region
# （见 data/03_semantic_views.sql），引擎每次查询前把调用方给的 scope 写进这个变量。
# scope 为空或 'ALL' 时策略放行全部（W5 要改成 fail-closed，见 docs/01-architecture.md）。
scope:
  session_var: chemq.region

# 评测的"今天"。评测、CLI、API、Agent 不传 as_of 时都用它。
eval:
  as_of: "2026-09-14"

# 填进通用提示词模板（ai/src/chemq/prompts/<locale>/）的空位 {{name}}。
prompt_slots:
  system_name: 示例化工经营分析系统
  assistant_name: 示例化工经营分析助手
  data_name: 示例化工经营数据
  analysis_scope: 经营分析
  agent_question_scope: 经营数据和公司制度类问题
  kb_scope: 公司制度、指标口径、月度经营分析报告      # 知识库里有什么（Agent 工具清单、知识库回答、检索工具说明三处共用）
  knowledge_topics: 制度、口径定义、规程
  knowledge_example: 综合能耗怎么算
  out_of_scope_examples: 生产成本、利润、人工成本
  lookalike_note: |2-
      ⚠ 只看指标名是否在字典里，不要看字面：「能源成本」「销量」在字典里，是支持的指标；
        不要因为名字里带"成本"两个字就判 out_of_scope。
  no_hardcode_examples: 折标煤系数、税率
  filter_dimensions: 装置、产品、客户、大区、能源
  breakdown_example: 按装置拆开
  kb_ref_example: KB-ENE-2026#7
