# ---------- W4 新题验证集（holdout）----------
# 规则：这批题跑出结果后，**不能再拿它们来调规则** —— 否则它们就变成"见过的题"，验证就失效了。
# 主评测集的 20 题在 W2–W4 里被反复用来调规则，分数会偏乐观；这批题用来检验规则是不是真的学会了。
- set: holdout
  id: H01
  week: 3
  difficulty: easy
