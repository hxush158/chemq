# Short English phrases used in prompts. Slot values {{name}} come from the domain pack's domain.yaml prompt_slots;
# dialect-specific ones (ENGINE_NAME, MONTH_FMT) come from chemq/dialects.py. Keys must match prompts/zh/strings.yaml.
router_examples_title: '# Routing examples'
router_example_label: Example
router_example_question: 'User question: '
router_example_plan: 'Parsed plan: '
tool_list_metrics: Returns the metric dictionary and the semantic catalog (which views exist, their columns, dimension values). Call this before writing SQL.
tool_run_sql: |-
  Run one read-only SQL query ({{ENGINE_NAME}}). Only the views and dimension tables in the semantic catalog can be queried; a LIMIT is added automatically. Returns ok/rows; if ok=false, read violations or error, fix the SQL and retry.
  Result contract (the result must be readable by people and comparable by programs):
  1. Format month columns as {{MONTH_FMT}}, not as a date; do not add a month column unless the question asks for a monthly breakdown.
  2. "Which / who … highest / lowest" returns only that 1 row (sort, then LIMIT 1); "top N" returns N rows. Take the sort direction from the question.
  3. Period-over-period / year-over-year / two-period comparison: return the raw value of each period as its own row, not one row with a difference.
  4. Return only the columns asked for; compute ratios and averages in SQL as "sum first, then divide".
tool_search: Search {{kb_scope}}. found=false means the knowledge base has nothing relevant.
mcp_instructions: 'Read-only query tools for {{data_name}}. Call list_metrics for metric definitions and the semantic catalog before writing SQL; numbers may only come from run_semantic_query results; use search_knowledge for rules and definitions, and if found=false say plainly that the knowledge base has nothing on it.'

# ---- Semantic catalog (used by scripts/build_catalog.py to generate semantic_catalog.md) ----
catalog_title: '# Semantic catalog'
catalog_coverage: 'Data coverage: {{start}} ~ {{end}} (daily grain).'
catalog_scope_note: 'Only the views and dimension tables listed below can be queried (schema {{schema}}). Tables and columns not listed do not exist — do not guess.'
catalog_views: '## Views'
catalog_dims: '## Dimension tables'
catalog_columns: 'Columns: '
catalog_column: '{{name}} ({{type}})'
catalog_column_sep: ', '
catalog_values: '## Dimension values'
catalog_values_note: 'When filtering by name, use only these exact values (character for character), or the corresponding ID; do not abbreviate and do not use LIKE.'

# ---- "Data coverage" in prompts (router.data_range()) ----
data_range: '{{start}} to {{end}}'

# ---- Model user messages, dictionary heading, refusal markers and JSON Schema ----
router_user_message: |-
  Base date: {{as_of}}
  User question: {{question}}
text2sql_user_question: 'Original user question: {{question}}'
text2sql_base_date: 'Base date: {{as_of}}'
text2sql_plan_title: 'Query plan (from the upstream parser; if time_range is present, use it as authoritative and do not recalculate dates from the original question):'
kb_sql_results: |-
  Database query results (already calculated by the system; copy them, do not recalculate):
  {{rows}}
kb_user_question: 'User question: {{question}}'
metric_dictionary_title: '# Metric dictionary'
marker_cannot_answer: '[CANNOT ANSWER]'
marker_not_covered: '[NOT COVERED]'
mcp_instructions_no_kb: 'Read-only query tools for {{data_name}}. Call list_metrics for metric definitions and the semantic catalog before writing SQL; numbers may only come from run_semantic_query results. This domain has no knowledge base and cannot provide explanations grounded in supporting documents.'
dict_title: Metric dictionary
schema_query_plan: Parse the user question into a structured query plan without SQL.
schema_sql_candidate: A SQL candidate or an explicit reason for refusal.
schema_time_start: ISO date YYYY-MM-DD
schema_time_end: ISO date YYYY-MM-DD, inclusive
schema_metrics: Standard metric names from the metric dictionary
schema_dimensions: 'For example: {{dimension_examples}}'
schema_compare_range: Comparison period for year-over-year, period-over-period or two-period comparisons; null if no comparison is requested
schema_needs_knowledge: Whether rules or metric definition documents need to be consulted
schema_reasoning: One sentence explaining the decision
schema_sql: Read-only SQL. Leave an empty string when refuse_reason is non-empty.
schema_refuse_reason: Only provide a reason when the semantic views below cannot answer faithfully (the metric does not exist or the required period has no data), and leave sql empty. Must be null when the question can be answered. Never put a refusal into a SQL string.
schema_metric_definitions_used: Which metric definition entries from the dictionary were used
schema_assumptions: Statements the metric dictionary requires the answer to carry, one sentence each and without numbers; empty when none is required
schema_answer_intent: Intent determined by the router; evals uses it for intent_acc
schema_answer_refused: Whether the answer was refused; evals uses it for refuse_acc
schema_answer_no_data: The query ran but returned 0 rows; a normal answer, not a refusal
schema_answer_cost: Total API cost for this question and answer
schema_answer_numbers_from_sql: True means all numbers come from SQL results and the model performed no arithmetic

# ---- Critic locale rules; single quotes preserve regex backslashes ----
critic_date_pattern: '(?ix)\b\d{4}\s*[-/.]\s*\d{1,2}(?:\s*[-/.]\s*\d{1,2})?\b|\b\d{1,2}[-/]\d{1,2}[-/]\d{4}\b|\b(?:\d{1,2}(?:st|nd|rd|th)?\s+)?(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\.?\s+(?:\d{4}|\d{1,2}(?:st|nd|rd|th)?(?:,?\s+\d{4})?)\b|\bQ[1-4](?:\s+\d{4})?\b'
critic_unit_after_pattern: '(?i)^\s*(?:%|(?:times?|nodes?|plants?|products?|customers?|tonnes?|tons?|t|hours?|days?|months?|years?|periods?|trades?|kWh|MWh|MW|NZD|dollars?|cents?|percent(?:age\s+points?)?)\b)'
critic_scale_after_pattern: '(?i)^\s*(thousand|million|billion)\b'
critic_range_then_unit_pattern: '(?i)^\s*(?:[～~—–-]|to\b)\s*-?\d[\d,]*(?:\.\d+)?\s*(thousand|million|billion)\b'
critic_scale_factors: '{"thousand": 1000, "million": 1000000, "billion": 1000000000}'

# ---- User-facing text (W3 step 0): refusal reasons, caveats, knowledge-base notices, no data ----
time_label_main: The requested period
time_label_compare: The comparison period
time_missing_range: The query plan has no time range for the requested period
time_invalid_date: '{{label}} contains an invalid date'
time_start_after_end: '{{label}} starts after it ends'
time_no_overlap: 'The requested period does not overlap the data coverage ({{span}})'
time_compare_not_covered: 'The comparison period is not fully within the data coverage ({{span}})'
time_main_partial_with_compare: 'The requested period is only partly within the data coverage ({{span}}), so the two periods cannot be compared'
time_clipped: 'The requested period {{start}} to {{end}} was trimmed to {{clip_start}} to {{clip_end}}; only the covered part was queried'
time_unavailable: The requested time is not available
caveat_time_refused: Time is outside the data coverage (checked in code)
caveat_time_clipped: 'Time range trimmed (checked in code): {{reason}}'
caveat_sql_refused: 'The SQL step refused ({{kind}})'
caveat_kb_refused: 'The knowledge base refused ({{kind}})'
caveat_kb_no_explanation: 'The numbers were found, but the knowledge base gave no explanation ({{kind}}): {{detail}}'
caveat_agent_stopped: 'The agent did not finish normally: {{stop}}'
caveat_no_citation_blocked: The answer cited no source and was blocked (no_citation)
caveat_explanation_uncited: The explanation cites no source and was not verified against one
caveat_unverified_numbers: 'These numbers appear in neither the query results nor the cited text: {{numbers}}'
list_sep: ', '
hook_tool_denied: '{{name}} is not an allowed tool; use only {{tools}}'
kb_no_hit: The knowledge base has nothing relevant to this question.
kb_no_citation: This answer did not cite its sources, so it may not be based on the knowledge base, and it has been blocked. Please rephrase the question, or ask an administrator to add material.
no_data: The query ran, but there is no data matching this question in that period (0 rows). This does not mean the value is zero.
note_date_range: "Date range: {{start}} to {{end}}"
