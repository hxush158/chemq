# 中文提示词里的短句。空位 {{name}} 的值来自领域包 domain.yaml 的 prompt_slots，
# 方言相关的（ENGINE_NAME、MONTH_FMT）来自 chemq/dialects.py。
router_examples_title: '# 路由解析示例'
router_example_label: 示例
router_example_question: 用户提问：
router_example_plan: 解析结果：
tool_list_metrics: 返回指标口径字典和语义层目录（能查哪些视图、有哪些列、维度取值）。写 SQL 前先调这个。
tool_run_sql: |-
  执行一条只读 SQL（{{ENGINE_NAME}}），只能查语义层目录里的视图和维度表，会自动加 LIMIT。返回 ok/rows；ok=false 时看 violations 或 error，改了再试。
  结果集约定（结果要能直接给人看，也要能被程序比对）：
  1. 月份列用 {{MONTH_FMT}} 输出，不要返回 date；问题没要求按月就不要加月份列。
  2. 问「哪个/谁…最高/最低」只返回那 1 行（排序后 LIMIT 1）；问「前 N 个」返回 N 行。排序方向按问题里的方向词。
  3. 环比/同比/两期对比：返回两期的原值各一行，不要压成一行差值。
  4. 只返回问题要的列；比例、均值按「先 sum 再相除」在 SQL 里算好。
tool_search: 检索{{kb_search_scope}}。found=false 表示知识库里没有相关资料。
mcp_instructions: '{{data_name}}的只读查询工具。写 SQL 之前先调 list_metrics 看指标口径和语义层目录；数字只能来自 run_semantic_query 的结果；制度、口径解释用 search_knowledge，found=false 时如实说知识库里没有。'
