[project]
name = "chemq"
version = "0.1.0"
description = "示例化工经营分析智能问数 · AI 服务层"
requires-python = ">=3.11"

# 核心依赖：W1–W2 只需要这些。刻意不含 claude-agent-sdk / fastapi / boto3，
# 它们体积大、带原生二进制，在老机器上容易装失败 —— 用到那一周再装（make install-all）。
dependencies = [
    "anthropic>=0.70",          # Client SDK: Messages API / structured outputs / prompt caching
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",              # 读指标口径字典
    "sqlglot>=25.0",            # SQL 解析 / 方言校验 —— SQL 护栏的核心
    "structlog>=24.4",
]

[project.optional-dependencies]
db    = ["psycopg[binary,pool]>=3.2", "pgvector>=0.3"]   # W2 起
agent = ["claude-agent-sdk>=0.1", "mcp>=1.2"]            # W4 起
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]    # W5 起
aws   = ["boto3>=1.35"]                                  # W5 起
dev   = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "python-dotenv>=1.0"]

[project.scripts]
chemq = "chemq.cli:main"

# 没有这一段的话 uv sync 不会把 src/chemq 装进虚拟环境，
# `from chemq import ...` 和 `chemq` 命令都会找不到。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemq"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
